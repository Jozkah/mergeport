# Mergeport: Postgres + web + worker from one image (docs/deploy.md).
#
#   cp .env.production.example .env      # then fill it in
#   docker compose up -d --build
#
# Everything comes from the file `.env` next to this one (a deployer's dashboard writes exactly that file). There is no variable
# substitution in this file, so a deployer that forbids it accepts it as is. Required in `.env`: MERGEPORT_PUBLIC_URL,
# POSTGRES_PASSWORD, and DATABASE_URL = postgresql://mergeport:<POSTGRES_PASSWORD>@postgres:5432/mergeport
# A reverse proxy with TLS terminates in front of `web` (published on 127.0.0.1 only). Do not publish Postgres.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: mergeport
      POSTGRES_DB: mergeport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mergeport -d mergeport"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        # Baked into the build: the public address (next.config.ts allows Server Actions from it). Changing it needs a rebuild.
        # A bare name takes its value from `.env`.
        - MERGEPORT_PUBLIC_URL
    image: mergeport:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    # The image's default command applies migrations, then serves on 0.0.0.0:3000. Its HEALTHCHECK calls GET /api/health.

  worker:
    image: mergeport:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MERGEPORT_ROLE: worker # the worker has no HTTP port: the image health check passes
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    depends_on:
      web:
        condition: service_healthy # migrations are done once the web service answers

volumes:
  pgdata:
